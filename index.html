<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세은 복습방">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<title>세은이 복습방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="lessons/lessons.js"></script>
<style>
:root{--bg:#FFFFFF;--ink:#1B2340;--muted:#6B7390;--line:#E3E7EF;--soft:#F4F6FA;--mark:#FFE45C;--sci:#0F9B83;--his:#C2410C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14181F;--ink:#E8ECF5;--muted:#9AA3BA;--line:#2B3345;--soft:#1C222D;--mark:#C9A92A;--sci:#4DD3B8;--his:#FFA265}}
:root[data-theme="dark"]{--bg:#14181F;--ink:#E8ECF5;--muted:#9AA3BA;--line:#2B3345;--soft:#1C222D;--mark:#C9A92A;--sci:#4DD3B8;--his:#FFA265}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.6;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:24px 0 48px}
h1{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;font-size:28px;margin:0}
.dday{margin:6px 0 0;font-size:15px;color:var(--muted)}
.dday b{color:var(--ink);background:var(--mark);border-radius:6px;padding:0 6px;margin-right:4px}
.subj{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 6px;position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}
.subj button{font-family:"Jua","Noto Sans KR",sans-serif;font-size:24px;border:2px solid var(--line);background:var(--bg);color:var(--muted);border-radius:16px;padding:12px 8px;cursor:pointer}
.subj button[aria-pressed="true"]{color:#fff;border-color:transparent}
.subj button.sci[aria-pressed="true"]{background:var(--sci)}
.subj button.his[aria-pressed="true"]{background:var(--his)}
:root[data-theme="dark"] .subj button[aria-pressed="true"]{color:#14181F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .subj button[aria-pressed="true"]{color:#14181F}}
.pick{margin:4px 0 0}
.pick select{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);max-width:100%}
.frame{display:block;width:100%;border:0;min-height:60vh;background:transparent;margin-top:4px}
.empty{margin:24px 0;padding:28px 16px;text-align:center;color:var(--muted);background:var(--soft);border-radius:16px}
details.more{margin-top:36px;border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;color:var(--muted);font-size:15px}
.more .in{display:grid;gap:12px;margin-top:12px}
.exam{display:flex;gap:10px;align-items:center;font-size:15px}
.exam b{font-variant-numeric:tabular-nums;background:var(--mark);color:#1B2340;border-radius:6px;padding:0 6px;white-space:nowrap}
.exam span{flex:1}
.exam button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);min-width:0}
.row input[type=text]{flex:1 1 180px}
.small{font-size:13.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>세은이 복습방</h1>
  <p class="dday" id="dday" hidden></p>

  <div class="subj" role="group" aria-label="과목">
    <button type="button" class="sci" data-s="sci" aria-pressed="false">🔬 과학</button>
    <button type="button" class="his" data-s="hist" aria-pressed="false">📜 역사</button>
  </div>
  <div class="pick" id="pick" hidden><select id="sel" aria-label="단원 고르기"></select></div>
  <iframe class="frame" id="frame" title="단원 공부" scrolling="no"></iframe>
  <p class="empty" id="empty" hidden></p>

  <details class="more">
    <summary>📅 시험 날짜 · 기록 · 백업</summary>
    <div class="in">
      <div id="exams"></div>
      <div class="row">
        <input type="text" id="exName" placeholder="시험 이름 (예: 2학기 기말고사)">
        <input type="date" id="exDate" aria-label="시험 날짜">
        <button class="btn" type="button" id="exAdd">추가</button>
      </div>
      <p class="small" id="stat"></p>
      <div class="row">
        <button class="btn" type="button" id="exportBtn">백업 파일 받기</button>
        <button class="btn" type="button" id="importBtn">백업 불러오기</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <p class="small">기록은 이 기기 안에만 저장돼요. 아이패드는 홈 화면에 추가한 아이콘으로만 열어 주세요.</p>
    </div>
  </details>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  "use strict";
  var KEY = "seeun.rv.v1", SKEY = "seeun.study.v1";
  var NAME = {sci:"과학", hist:"역사"};
  var LESSONS = (window.LESSONS || []).filter(function(x){ return NAME[x.subj]; })
    .sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  var $ = function(id){ return document.getElementById(id); };
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function today(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s){ var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function md(s){ var d = parse(s); return (d.getMonth() + 1) + "/" + d.getDate(); }
  function dn(s){ var n = Math.round((parse(s) - parse(today())) / 86400000); return n === 0 ? "D-DAY" : n > 0 ? "D-" + n : "D+" + (-n); }
  function load(k, d){ try{ var v = JSON.parse(localStorage.getItem(k) || "null"); return v || d; }catch(e){ return d; } }
  function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function ui(k, v){ try{ if(v === undefined) return localStorage.getItem("seeun.rv.ui." + k); localStorage.setItem("seeun.rv.ui." + k, v); }catch(e){ return null; } }
  var D = load(KEY, {}); if(!D.exams) D.exams = [];
  function save(){ store(KEY, D); }
  var tt; function toast(m){ var t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ t.hidden = true; }, 2000); }

  // ---- 과목 → 단원 ----
  var cur = {subj: ui("subj2") || (LESSONS[0] ? LESSONS[0].subj : "hist"), id: null};
  if(!NAME[cur.subj]) cur.subj = "hist";
  function show(){
    document.querySelectorAll(".subj button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.s === cur.subj)); });
    var list = LESSONS.filter(function(x){ return x.subj === cur.subj; });
    var f = $("frame");
    if(!list.length){
      f.hidden = true; f.removeAttribute("data-id"); $("pick").hidden = true;
      $("empty").hidden = false; $("empty").textContent = NAME[cur.subj] + "은 아직 올라온 단원이 없어요. 엄마가 교과서 사진을 보내 주면 여기에 생겨요.";
      return;
    }
    $("empty").hidden = true; f.hidden = false;
    var x = list.filter(function(l){ return l.id === cur.id; })[0] || list[0];
    cur.id = x.id;
    var sel = $("sel"); sel.textContent = "";
    list.forEach(function(l){ var o = document.createElement("option"); o.value = l.id; o.textContent = md(l.date) + " · " + l.title + (l.date === today() ? " (오늘)" : ""); o.selected = l.id === x.id; sel.appendChild(o); });
    $("pick").hidden = list.length < 2;
    if(f.getAttribute("data-id") !== x.id){ f.setAttribute("data-id", x.id); f.style.height = "60vh"; f.src = x.file + "?embed=1"; }
  }
  document.querySelectorAll(".subj button").forEach(function(b){
    b.addEventListener("click", function(){ cur.subj = b.dataset.s; cur.id = null; ui("subj2", cur.subj); show(); });
  });
  $("sel").addEventListener("change", function(){ cur.id = this.value; show(); });
  var ro = null;
  function fit(){ var f = $("frame"); try{ var h = f.contentDocument.documentElement.scrollHeight; if(h) f.style.height = h + "px"; }catch(e){} }
  $("frame").addEventListener("load", function(){ fit(); try{ if(ro) ro.disconnect(); ro = new ResizeObserver(fit); ro.observe(this.contentDocument.body); }catch(e){ setInterval(fit, 1000); } });
  window.addEventListener("message", function(e){ if(e.origin === location.origin && e.data && e.data.seeunStudy){ fit(); stat(); } });
  window.addEventListener("resize", fit);

  // ---- 시험 D-day ----
  function upcoming(){ var t = today(); return D.exams.filter(function(e){ return e.date >= t; }).sort(function(a, b){ return a.date < b.date ? -1 : 1; }); }
  function renderDday(){
    var up = upcoming(), p = $("dday"); p.textContent = "";
    p.hidden = !up.length; if(!up.length) return;
    var b = document.createElement("b"); b.textContent = dn(up[0].date); p.appendChild(b);
    p.appendChild(document.createTextNode(up[0].name + (up[1] ? "  ·  다음: " + up[1].name + " " + dn(up[1].date) : "")));
  }
  function renderExams(){
    var box = $("exams"); box.textContent = "";
    var list = D.exams.slice().sort(function(a, b){ return a.date < b.date ? -1 : 1; }).filter(function(e){ return e.date >= today(); });
    if(!list.length){ box.innerHTML = '<p class="small">시험 날짜를 넣으면 맨 위에 D-day가 떠요.</p>'; return; }
    list.forEach(function(e){
      var row = document.createElement("div"); row.className = "exam";
      var b = document.createElement("b"); b.textContent = dn(e.date);
      var s = document.createElement("span"); s.textContent = e.name + " (" + md(e.date) + ")";
      var x = document.createElement("button"); x.type = "button"; x.textContent = "지우기";
      x.onclick = function(){ if(!confirm(e.name + " 일정을 지울까요?")) return; D.exams = D.exams.filter(function(y){ return y !== e; }); save(); renderExams(); renderDday(); };
      row.appendChild(b); row.appendChild(s); row.appendChild(x); box.appendChild(row);
    });
  }
  $("exAdd").addEventListener("click", function(){
    var n = $("exName").value.trim(), d = $("exDate").value;
    if(!n){ $("exName").focus(); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ $("exDate").focus(); toast("날짜를 골라 주세요"); return; }
    D.exams.push({id: Date.now().toString(36), name: n, date: d, subjs: [], range: ""}); save();
    $("exName").value = ""; $("exDate").value = ""; renderExams(); renderDday(); toast("저장했어요");
  });

  // ---- 기록 한 줄 ----
  function stat(){
    var S = load(SKEY, {days:{}, lessons:{}}), days = Object.keys(S.days || {}), q = 0, r = 0;
    days.forEach(function(d){ var x = S.days[d]; Object.keys(x).forEach(function(k){ q += x[k].quiz || 0; r += x[k].right || 0; }); });
    var streak = 0, d = today(), set = {}; days.forEach(function(k){ set[k] = 1; });
    function prev(s){ var t = parse(s); t.setDate(t.getDate() - 1); return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate()); }
    if(!set[d]) d = prev(d);
    while(set[d]){ streak++; d = prev(d); }
    $("stat").textContent = "공부한 날 " + days.length + "일 · 연속 " + streak + "일 · 퀴즈 " + q + "문제 중 " + r + "개 맞힘";
  }

  // ---- 백업 ----
  $("exportBtn").addEventListener("click", function(){
    var out = JSON.parse(JSON.stringify(D)); out.study = load(SKEY, {days:{}, lessons:{}});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], {type:"application/json"}));
    a.download = "세은복습방-백업-" + today() + ".json"; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
  $("importFile").addEventListener("change", function(){
    var f = this.files[0]; this.value = ""; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var v = JSON.parse(r.result);
        var ids = {}; D.exams.forEach(function(e){ ids[e.id] = 1; });
        (v.exams || []).forEach(function(e){ if(!ids[e.id]) D.exams.push(e); });
        if(v.wrong && !D.wrong) D.wrong = v.wrong;
        if(v.study && v.study.days){
          var S = load(SKEY, {days:{}, lessons:{}});
          Object.keys(v.study.days).forEach(function(d){ S.days[d] = S.days[d] || {}; Object.keys(v.study.days[d]).forEach(function(k){ if(!S.days[d][k]) S.days[d][k] = v.study.days[d][k]; }); });
          Object.keys(v.study.lessons || {}).forEach(function(k){ if(!S.lessons[k]) S.lessons[k] = v.study.lessons[k]; });
          store(SKEY, S);
        }
        save(); renderExams(); renderDday(); stat(); toast("백업을 합쳤어요");
      }catch(e){ toast("백업 파일이 아니에요"); }
    };
    r.readAsText(f);
  });

  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  document.addEventListener("visibilitychange", function(){ if(!document.hidden){ renderDday(); stat(); } });
  show(); renderDday(); renderExams(); stat();
})();
</script>
</body>
</html>
